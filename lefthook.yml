pre-commit:
  commands:
    spotless:
      glob: "backend/**/*.java"
      run: cd backend && mvn spotless:check

    prettier:
      glob: "frontend/**/*.{ts,html,scss,css,json}"
      run: frontend/node_modules/.bin/prettier --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: commitlint lint --message={1}