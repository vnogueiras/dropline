spring:
  application:
    name: catalog-service
  jpa:
    properties:
      hibernate:
        type:
          json_format_mapper: jackson3
        jdbc:
          batch_size: 500
        order_inserts: true
  profiles:
    default: local

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Dropline Catalog Service
    description: Catalog service for Dropline
    version: 0.0.1