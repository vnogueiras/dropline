spring:
  application:
    name: catalog-service
  jpa:
    properties:
      hibernate:
        type:
          json_format_mapper: jackson3
        jdbc:
          batch_size: 500
        order_inserts: true
  profiles:
    default: local
  data:
    web:
      pageable:
        serialization-mode: via-dto
  mvc:
    problemdetails:
      enabled: true

# OpenAPI docs: spec at /v3/api-docs, Swagger UI at /swagger-ui.html (both springdoc defaults)
springdoc:
  # document only the public API, not Boot's /error or anything else
  paths-to-match: /api/**
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Dropline Catalog Service
    description: Catalog service for Dropline
    version: 0.0.1