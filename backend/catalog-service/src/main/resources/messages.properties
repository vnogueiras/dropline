# ProblemDetail titles and details for exceptions handled by ResponseEntityExceptionHandler.
# Keys: problemDetail.title.<exception class> and problemDetail.<exception class>
# See "Error Responses > Customization and i18n" in the Spring Framework reference docs.

# GET /api/events/not-a-uuid, ?status=INVALID ({0} = parameter name, {1} = value)
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Invalid Request Parameter
problemDetail.org.springframework.beans.TypeMismatchException=Invalid value ''{1}'' for parameter ''{0}''

# @Min/@Max on request parameters, e.g. ?size=500 (field details come in step 5)
problemDetail.title.org.springframework.web.method.annotation.HandlerMethodValidationException=Validation Failed
