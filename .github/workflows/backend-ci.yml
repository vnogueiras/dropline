
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/openapi/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify
        working-directory: backend

      - name: Check the committed OpenAPI spec is up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/openapi)" ]; then
            echo "::error::docs/openapi is out of date. Run './mvnw verify' in backend/ and commit the result."
            git status --porcelain -- docs/openapi
            git diff -- docs/openapi
            exit 1
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
            backend/**/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
