rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert

  header-max-length:
    - 2
    - always
    - 72

  type-case:
    - 2
    - always
    - lower-case

  subject-empty:
    - 2
    - never

  subject-full-stop:
    - 2
    - never
    - "."