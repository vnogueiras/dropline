<mat-toolbar>
  <app-logo />
  <span class="spacer"></span>

  <!-- Desktop navigation -->
  <nav class="nav-links">
    <a mat-button routerLink="/events">Events</a>
    <button mat-button disabled>My Tickets</button>
  </nav>

  <!-- Mobile navigation -->
  <button
    class="mobile-menu-button"
    mat-icon-button
    [matMenuTriggerFor]="mobileMenu"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu">
    <a mat-menu-item routerLink="/events">Events</a>
    <button mat-menu-item disabled>My Tickets</button>
  </mat-menu>

  <!-- Theme toggle -->
  <button
    class="theme-button"
    mat-icon-button
    (click)="themeService.toggleTheme()"
    [attr.aria-label]="
      themeService.theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'
    "
  >
    <mat-icon>
      {{ themeService.theme() === 'light' ? 'dark_mode' : 'light_mode' }}
    </mat-icon>
  </button>
</mat-toolbar>
